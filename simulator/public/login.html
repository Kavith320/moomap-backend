<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>MooMap Simulator · Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --ink: #2f2f2f; --muted: #6b6b6b; --line: #e3e3e0; --brand: #ff8c00; --brand-dark: #d86f00; --sim: #6c4ce0; --bad: #e53935; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px;
    font-family: "Outfit", system-ui, sans-serif; color: var(--ink); background: #2f2f2f; }
  .card { width: 100%; max-width: 380px; background: #fff; border-radius: 16px; padding: 28px 24px; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
  .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 1.25rem; }
  .tag { background: var(--sim); color: #fff; font-size: .68rem; letter-spacing: .08em; padding: 3px 8px; border-radius: 999px; }
  p.sub { color: var(--muted); font-size: .9rem; margin: 6px 0 22px; }
  label { display: block; font-size: .82rem; font-weight: 600; margin-bottom: 6px; }
  input { width: 100%; min-height: 46px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font: inherit; font-size: 16px; margin-bottom: 14px; }
  input:focus { outline: none; border-color: var(--brand); box-shadow: 0 0 0 3px rgba(255,140,0,.15); }
  button { width: 100%; min-height: 46px; border: 0; border-radius: 10px; background: var(--brand); color: #fff; font: inherit; font-weight: 700; cursor: pointer; }
  button:hover { background: var(--brand-dark); }
  button:disabled { opacity: .6; cursor: wait; }
  .err { display: none; background: rgba(229,57,53,.1); color: var(--bad); padding: 10px 12px; border-radius: 10px; font-size: .85rem; margin-bottom: 14px; }
  .note { margin-top: 16px; font-size: .78rem; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<form class="card" id="f">
  <div class="brand">🐄 MooMap <span class="tag">SIMULATOR</span></div>
  <p class="sub">Sign in with a MooMap admin account to control the test herd.</p>
  <div class="err" id="err" role="alert"></div>
  <label for="mobile">Mobile number</label>
  <input id="mobile" type="tel" inputmode="numeric" autocomplete="username" required />
  <label for="password">Password</label>
  <input id="password" type="password" autocomplete="current-password" required />
  <button id="go" type="submit">Sign in</button>
  <p class="note">Test environment: actions here create simulated collar data and alerts.</p>
</form>
<script>
  const f = document.getElementById("f"), err = document.getElementById("err"), go = document.getElementById("go");
  f.addEventListener("submit", async (e) => {
    e.preventDefault();
    err.style.display = "none"; go.disabled = true; go.textContent = "Signing in…";
    try {
      const r = await fetch("login", { method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ mobile: document.getElementById("mobile").value.trim(), password: document.getElementById("password").value }) });
      const d = await r.json().catch(() => ({}));
      if (r.ok) { location.href = "./"; return; }
      err.textContent = d.error || "Sign in failed"; err.style.display = "block";
    } catch { err.textContent = "Simulator not reachable"; err.style.display = "block"; }
    go.disabled = false; go.textContent = "Sign in";
  });
</script>
</body>
</html>
