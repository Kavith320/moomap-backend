# /etc/mosquitto/conf.d/bridge-external.conf
# Copies real collar traffic from the external broker into this broker (one way: in only),
# so the backend can listen to the local broker and still receive real collars.
connection external-collars
address 62.146.182.119:1883
topic cc/# in 0
remote_clientid moomap-local-bridge
cleansession true
start_type automatic
restart_timeout 10 60
bridge_protocol_version mqttv311
try_private false
notifications false
# If the external broker requires login, uncomment:
#remote_username <user>
#remote_password <password>
