# /etc/mosquitto/conf.d/moomap.conf  (replaces default.conf)
# Local broker for MooMap. No anonymous access; users in /etc/mosquitto/passwd, rights in /etc/mosquitto/acl.
per_listener_settings false
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/acl

# Plain MQTT: backend + simulator on this host, collars on the LAN
listener 1883
protocol mqtt

# WebSockets: published by Tailscale Funnel at https://<host>/mqtt
listener 9001 127.0.0.1
protocol websockets
